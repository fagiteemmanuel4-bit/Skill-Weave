name: Build SkillWeave catalogue

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: skillweave-catalogue-index
  cancel-in-progress: false

jobs:
  index-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build public SKILL.md catalogue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-index.cjs
      - name: Commit catalogue if it changed
        run: |
          if git diff --quiet -- catalog.json; then
            echo "Catalogue is unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalog.json
            git commit -m "chore: refresh public skill catalogue"
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public site files
        run: |
          mkdir -p _site
          cp index.html library.html skill.html download.html app.js styles.css catalog.json _site/
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy refreshed site
        id: deployment
        uses: actions/deploy-pages@v4
